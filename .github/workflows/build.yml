name: Build & Release LogLynx

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.gitignore'
  workflow_dispatch:

# contents: write dibutuhkan untuk membuat tag + GitHub Release
permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Siapkan keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::GitHub Secrets signing belum ada (jalankan Box B). APK unsigned tidak akan dirilis."
          fi

      - name: Build release APK (R8 + shrinkResources)
        id: build
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          # tee: log penuh disimpan untuk artefak kegagalan; pipefail: exit code Gradle tetap dipakai
          set -o pipefail
          mkdir -p build-logs
          gradle assembleRelease --stacktrace 2>&1 | tee build-logs/gradle-assembleRelease.log

      - name: Verifikasi tanda tangan & siapkan aset rilis
        id: assets
        if: steps.keystore.outputs.signed == 'true'
        run: |
          set -euo pipefail
          BT="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n 1)"
          APK_SRC="$(ls app/build/outputs/apk/release/*.apk | head -n 1)"

          # Gagalkan job jika APK tidak ter-sign dengan benar (APK unsigned tidak bisa di-install)
          "${BT}apksigner" verify --verbose "$APK_SRC"

          # Versi dibaca dari APK hasil build (satu sumber kebenaran: Gradle)
          VERSION="$("${BT}aapt2" dump badging "$APK_SRC" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p" | head -n 1)"
          if [ -z "$VERSION" ]; then
            echo "::error::versionName tidak terbaca dari APK"
            exit 1
          fi

          OUT="LogLynx-v${VERSION}.apk"
          cp "$APK_SRC" "$OUT"
          sha256sum "$OUT" > "$OUT.sha256"
          HASH="$(cut -d' ' -f1 "$OUT.sha256")"

          # Catatan rilis = entri teratas CHANGELOG.md (urutan descending) + panduan install
          {
            awk '/^## /{n++; next} n==1' CHANGELOG.md
            echo
            echo "---"
            echo "**Install:** unduh \`$OUT\` lalu buka di Android 8.0+ (izinkan install dari sumber ini jika diminta)."
            echo
            echo "**Log sistem penuh:** jalankan Shizuku lalu beri izin ke LogLynx."
            echo
            echo "**SHA-256:** \`$HASH\`"
          } > release_notes.md

          {
            echo "version=$VERSION"
            echo "apk=$OUT"
          } >> "$GITHUB_OUTPUT"

      - name: Publikasi GitHub Release
        id: publish
        if: steps.keystore.outputs.signed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.assets.outputs.version }}
          APK: ${{ steps.assets.outputs.apk }}
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            # Re-run job yang sama: timpa aset, jangan buat release ganda
            gh release upload "$TAG" "$APK" "$APK.sha256" --clobber
          else
            gh release create "$TAG" "$APK" "$APK.sha256" \
              --target "$GITHUB_SHA" \
              --title "LogLynx v${VERSION}" \
              --notes-file release_notes.md \
              --latest
          fi

      - name: Hapus keystore dari runner
        if: always()
        run: rm -f release.keystore

      # ---- Jalur artefak log kegagalan (hanya saat gagal/dibatalkan) ----
      # Nama: LogLynx-failure-run<NNNN>-a<attempt>-<fase>-<sha7> (run number naik otomatis,
      # attempt naik tiap re-run, jadi tidak pernah bentrok). Secret disamarkan sebelum diunggah.
      - name: Kumpulkan log kegagalan
        id: faillog
        if: ${{ failure() || cancelled() }}
        continue-on-error: true
        env:
          APP_NAME: LogLynx
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_ID: ${{ github.run_id }}
          COMMIT_SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
          REPOSITORY: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
          OUTCOME_KEYSTORE: ${{ steps.keystore.outcome }}
          OUTCOME_BUILD: ${{ steps.build.outcome }}
          OUTCOME_ASSETS: ${{ steps.assets.outcome }}
          OUTCOME_PUBLISH: ${{ steps.publish.outcome }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: bash .github/scripts/collect-failure-logs.sh

      - name: Unggah artefak log kegagalan
        id: upload-faillog
        if: ${{ (failure() || cancelled()) && steps.faillog.outputs.name != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.faillog.outputs.name }}
          path: ${{ steps.faillog.outputs.dir }}
          if-no-files-found: warn
          retention-days: 30

      - name: Tautkan artefak di ringkasan run
        if: ${{ (failure() || cancelled()) && steps.upload-faillog.outputs.artifact-url != '' }}
        env:
          ARTIFACT_NAME: ${{ steps.faillog.outputs.name }}
          ARTIFACT_URL: ${{ steps.upload-faillog.outputs.artifact-url }}
        run: |
          {
            echo
            echo "**Unduh log kegagalan:** [${ARTIFACT_NAME}](${ARTIFACT_URL})"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: LogLynx-release
          path: app/build/outputs/apk/release/*.apk
          retention-days: 14

      # Mapping R8 untuk membaca stack trace crash rilis
      - uses: actions/upload-artifact@v4
        with:
          name: LogLynx-mapping
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: warn
          retention-days: 30
